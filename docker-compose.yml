# OpenSASE -- compose deployment for non-Nix users.
#
# The images below are built by Nix in CI (this repo ships no Dockerfiles as
# build inputs) and published to GHCR. Runs on Linux/macOS/Windows with any
# OCI runtime (Docker Desktop, Podman, containerd):
#
#   git clone https://github.com/shsingh/opensase && cd opensase
#   nix run .#vpn-init                # one-time OpenVPN CA bootstrap (or see
#                                     # README for the container-only path)
#   docker compose -p opensase up -d
#
# Nix users: `nix run .#load-images` builds the byte-identical images from
# the flake locally instead of pulling from GHCR.
#
# The legacy CentOS 7 Dockerfiles (dnsmasq/ clamav/ cicap/ squid/ openvpn/)
# are kept for archaeology only -- nothing composes from them anymore.

name: opensase

volumes:
  data:            # dnsmasq lease/log data + clamav db
  openvpn_priv:    # VPN CA + server/client certs (bootstrap first!)
  mitm_data:       # mitmproxy confdir + JSONL decision log

networks:
  main:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.50.0/24

services:
  dnsmasq:
    hostname: dnsmasq
    image: ghcr.io/shsingh/opensase-dnsmasq:latest
    cap_add: [ NET_ADMIN ]
    expose: [ "53/tcp", "53/udp" ]
    volumes: [ "data:/var/lib/misc" ]
    networks:
      main:
        ipv4_address: 192.168.50.2

  clamav:
    hostname: clamav
    image: ghcr.io/shsingh/opensase-clamav:latest
    expose: [ "3310/tcp" ]
    # first run populates the DB (set SKIP_FRESHCLAM=1 to go offline)
    volumes: [ "data:/var/lib/clamav" ]
    networks:
      main:
        ipv4_address: 192.168.50.3

  mitmproxy:
    hostname: mitmproxy
    image: ghcr.io/shsingh/opensase-mitmproxy:latest
    depends_on: [ clamav ]
    expose: [ "8080/tcp" ]
    environment:
      - CLAMD_HOST=clamav
      - CLAMD_PORT=3310
    volumes: [ "mitm_data:/data" ]
    networks:
      main:
        ipv4_address: 192.168.50.4
    # explicit-proxy clients point at this; VPN traffic is forwarded here
    # by the openvpn container's config (visible-proxy mode v1).

  openvpn:
    hostname: openvpn
    image: ghcr.io/shsingh/opensase-openvpn:latest
    depends_on: [ dnsmasq, mitmproxy ]
    cap_add: [ NET_ADMIN ]
    ports:
      - "5443:5443/udp"
    volumes:
      - openvpn_priv:/data-priv
      - data:/data
    networks:
      main:
        ipv4_address: 192.168.50.5
    # /data-priv/server.conf must exist: bootstrap with `nix run .#vpn-init`
    # and copy ./state/openvpn/* into the volume (README), or supply your own
    # server.conf + PKI.