name: release-images
# Build -> smoke -> publish. The smoke gate runs the real compose stack from
# the freshly built images (clamd verdicts + decision-log assertions) BEFORE
# anything is pushed: a failing smoke blocks the release. Merge-path CI is
# never slowed by this file -- it only fires on v* tags and manual dispatch.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write        # draft release + release notes + SBOM assets
  packages: write        # push images to GHCR

env:
  OWNER: ${{ github.repository_owner }}

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [dnsmasq, clamav, mitmproxy, openvpn]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Build OCI image from flake
        run: nix build ".#image-${{ matrix.image }}" --out-link result-img

      - name: Stage image tarball
        run: cp result-img "opensase-${{ matrix.image }}-image.tar"

      - name: Upload image artifact for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: "image-${{ matrix.image }}"
          path: "opensase-${{ matrix.image }}-image.tar"
          retention-days: 1

  smoke-stack:
    needs: [build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download built image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'image-*'
          path: images
          merge-multiple: true

      - name: Load images into the local docker daemon
        run: |
          for img in dnsmasq clamav mitmproxy openvpn; do
            docker load < "images/opensase-${img}-image.tar"
            docker image inspect "opensase-${img}:latest" --format "loaded $img {{.Id}}"
          done

      - name: Start the stack from the smoke override
        run: |
          docker compose -p opensase \
            -f docker-compose.yml -f tests/smoke-override.yml \
            up -d --wait --wait-timeout 120
          docker compose -p opensase ps

      - name: Wait for clamd, then assert both verdicts (INSTREAM)
        run: |
          python3 tests/instream_probe.py --host 127.0.0.1 --port 3310 --wait 600

      - name: Decision-log assertions through the proxy path
        run: |
          # explicit-proxy CONNECT through mitmproxy: example.com is on the
          # passlist (splice, tunneled), wikipedia.org is unlisted (bump)
          curl -sk --max-time 60 -x http://127.0.0.1:8080 https://example.com -o /dev/null
          curl -sk --max-time 60 -x http://127.0.0.1:8080 https://www.wikipedia.org -o /dev/null
          docker compose -p opensase cp mitmproxy:/data/log/decisions.jsonl ./decisions.jsonl
          echo "--- decisions.jsonl ---"; cat decisions.jsonl
          grep -q '"host": "example.com"' decisions.jsonl && grep -q '"verdict": "splice"' decisions.jsonl
          grep -q '"host": "www.wikipedia.org"' decisions.jsonl && grep -q '"verdict": "bump"' decisions.jsonl
          echo "DECISION-LOG: PASS"

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -p opensase logs --tail=100

  publish-images:
    needs: [smoke-stack]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [dnsmasq, clamav, mitmproxy, openvpn]
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: "image-${{ matrix.image }}"
          path: .

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Load, tag, push
        run: |
          docker load < "opensase-${{ matrix.image }}-image.tar"
          VERSION="${GITHUB_REF_NAME#v}"
          for tag in latest "$VERSION"; do
            docker tag "opensase-${{ matrix.image }}:latest" \
              "ghcr.io/${OWNER}/opensase-${{ matrix.image }}:$tag"
            docker push "ghcr.io/${OWNER}/opensase-${{ matrix.image }}:$tag"
          done

      - name: Record pushed digest
        run: |
          docker inspect "ghcr.io/${OWNER}/opensase-${{ matrix.image }}:${GITHUB_REF_NAME#v}" \
            --format '{{index .RepoDigests 0}}' > "digests-${{ matrix.image }}.txt"
          cat "digests-${{ matrix.image }}.txt"

      # Supply-chain hygiene: SBOM artifact for each release tag.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: "ghcr.io/${{ github.repository_owner }}/opensase-${{ matrix.image }}:${{ github.ref_name }}"
          format: spdx-json
          artifact-name: "sbom-opensase-${{ matrix.image }}.spdx.json"

      - name: Upload digest for release-notes job
        uses: actions/upload-artifact@v4
        with:
          name: "digests-${{ matrix.image }}"
          path: "digests-${{ matrix.image }}.txt"
          retention-days: 1

  release-notes:
    needs: [publish-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: tag ranges + signed tags
          persist-credentials: false

      - name: Download build artifacts (digests + SBOMs)
        uses: actions/download-artifact@v4
        with:
          pattern: '*-opensase-*'
          path: assets
          merge-multiple: true

      - name: Verify tags are signed (fail the release otherwise)
        run: |
          git tag -v "${GITHUB_REF_NAME}" 2>&1 | grep -q "Good signature" \
            || { echo "::error::tag ${GITHUB_REF_NAME} is not a verified GPG-signed tag"; exit 1; }

      - name: Build release notes
        run: |
          PREV="$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | sed -n 1p || true)"
          {
            echo "## OpenSASE ${GITHUB_REF_NAME}"
            echo
            echo "SASE-style TLS inspection edge: OpenVPN → mitmproxy (decrypt/re-encrypt on URL category) → ClamAV → decision log."
            echo
            echo "### Nix-built OCI images — pull and \`docker compose up\` (no Nix needed)"
            echo
            echo "Images passed the release smoke gate (clamd verdicts + decision-log assertions) before publication."
            echo
            echo "| Image | Version tag | Digest |"
            echo "|---|---|---|"
            for img in dnsmasq clamav mitmproxy openvpn; do
              d="assets/digests-${img}.txt"
              digest="$(cat "$d" 2>/dev/null || echo '—')"
              echo "| \`opensase-${img}\` | \`${GITHUB_REF_NAME#v}\` | \`$(basename "$digest")\` |"
            done
            echo
            echo "### What changed"
            if [ -n "$PREV" ]; then
              git log --format='- %s (%h)' "${PREV}..${GITHUB_REF_NAME}"
            else
              git log --format='- %s (%h)' "${GITHUB_REF_NAME}"
            fi
            echo
            echo "### Deploy in ~60 seconds"
            echo '```bash'
            echo "git clone --depth 1 --branch ${GITHUB_REF_NAME} https://github.com/shsingh/opensase && cd opensase"
            echo "docker compose -p opensase up -d    # mitmproxy :8080 · openvpn udp/5443"
            echo '```'
            echo
            echo "### Verify the images"
            echo "- digests above (\`docker buildx imagetools inspect <ref>\`)"
            echo "- SBOMs (SPDX) attached as release assets below"
            echo
            echo "> **Nix users:** \`nix run .#load-images\` builds the byte-identical images from the flake — no pull needed."
            echo "> **Lab appliance — DO NOT run unmodified in production.**"
            echo
            echo "Docs: https://shsingh.github.io/opensase/"
          } > release-notes.md
          cat release-notes.md

      - name: Create draft release (signed tag, notes, SBOM assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --title "OpenSASE ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            assets/*.spdx.json
