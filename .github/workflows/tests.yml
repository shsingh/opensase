name: unit-tests
# Release-gated on purpose: fires on manual dispatch and v* tags only --
# never on pull_request/push, so the merge path keeps flake-check +
# pre-commit + dependency-review (fast, no test matrix). The compose smoke
# gate lives in release-images.yml (build -> smoke -> push).
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  addon-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test deps
        run: python -m pip install --quiet pytest

      - name: Addon unit tests (mitmproxy stubbed)
        run: python -m pytest tests/ -v
